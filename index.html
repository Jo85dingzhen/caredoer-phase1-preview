<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>岗位与培训 | CareDoer</title>
  <link rel="stylesheet" href="styles.css?v=directory">
  <script defer src="data.js"></script>
  <script defer src="app.js?v=directory"></script>
</head>
<body>
  <header class="masthead">
    <div class="shell header-inner">
      <a class="brand" href="#top" aria-label="CareDoer 首页">CareDoer</a>
      <nav aria-label="主导航">
        <a href="#roles">找岗位</a>
        <a href="#courses">首批课程</a>
        <button class="text-button" id="open-records" type="button">测试记录</button>
      </nav>
    </div>
  </header>
  <main id="top">
    <section id="roles" class="shell section directory" aria-labelledby="directory-title">
      <div class="directory-heading">
        <p class="scope">加州 / 第一阶段</p>
        <h1 id="directory-title">岗位与培训</h1>
        <p class="intro">选择岗位，查看对应课程、所需凭证和上岗步骤。</p>
      </div>
      <div class="list-heading">
        <h2>岗位目录</h2>
        <output id="role-count" class="count" aria-live="polite"></output>
      </div>
      <div class="filters" id="role-filters" role="group" aria-label="按工作方向筛选"></div>
      <div class="role-layout">
        <div class="role-list" id="role-list" aria-label="岗位列表"></div>
        <article class="role-detail" id="role-detail" aria-labelledby="role-title"></article>
      </div>
    </section>
    <section id="courses" class="section courses-section">
      <div class="shell">
        <h2 class="courses-heading">首批课程</h2>
        <div class="course-list" id="course-grid"></div>
      </div>
    </section>
  </main>
  <footer><div class="shell footer-inner"><span>CareDoer · ALLCPR</span><span>演示站 · 测试记录保存在当前浏览器</span></div></footer>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-header"><h2 id="dialog-title"></h2><button class="close" id="close-dialog" type="button" aria-label="关闭">×</button></div>
    <div id="dialog-body"></div>
  </dialog>
</body>
</html>
